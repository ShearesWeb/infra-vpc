include:
  - project: algebananazzzzz/gitlabtemplates
    ref: main
    file:
      - Jobs/terraform-jobs.yml

variables:
  ENV:
    value: "com"
    options:
      - "com"
    description: "The target environment for deployment"
  WORKSPACE:
    value: $ENV-all
  TF_DIR: $CI_PROJECT_DIR

stages:
  - "test"
  - "deploy"

terraform-plan:
  stage: test
  extends:
    - .terraform:plan
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

terraform-apply:
  stage: deploy
  dependencies:
    - terraform-plan
  extends:
    - .terraform:apply
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
